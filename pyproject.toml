[project]
name = "langgraph-practice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.15.0",
    "langchain>=1.3.13",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "poethepoet>=0.48.0",
    "pytest>=8.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "ANN401", # disallow explicit `Any` in type annotations
]
ignore = ["E501"]  # line too long

[tool.ruff.lint.isort]
known-third-party = ["langchain", "langgraph", "pydantic", "dotenv"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true  # **kwargs: Any is fine when overriding library callback hooks

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/unit"]
markers = [
    "integration: needs a real LM Studio server running locally (see tests/integration)",
]

[tool.poe.tasks]
install = "uv sync"
check = "ruff check ."
format = "ruff format ."
type-check = "mypy . --exclude '^tests/'"
lint = ["check", "type-check"]
fix = ["_ruff-fix", "format"]
_ruff-fix = "ruff check . --fix"
test = "pytest tests/unit"
test-integration = "pytest tests/integration -m integration"
test-all = ["test", "test-integration"]
