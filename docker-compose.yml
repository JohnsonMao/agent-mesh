services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistant-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/assistant
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    ipc: host

  postgres:
    image: pgvector/pgvector:pg16
    container_name: assistant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
